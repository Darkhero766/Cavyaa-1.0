<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CAVYAA — Healing Journey</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#1565C0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CAVYAA">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="orb-3"></div>
  <div class="phone-frame">
    <div class="landing-hero anim-fade-in">

      <!-- Logo -->
      <div class="landing-logo">
        <div class="logo-mark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
              fill="white"/>
          </svg>
        </div>
        CAVYAA 1.0
      </div>

      <!-- Headline -->
      <div>
        <h1 class="landing-headline anim-fade-up">
          <span>Let's make</span><br>
          <em>your days</em><br>
          <span>healthier</span>
        </h1>
        <p class="landing-sub anim-fade-up delay-1">No Rushing. Only your feelings.</p>

        <!-- Role pills with SVG icons -->
        <div class="role-pills anim-fade-up delay-2" id="rolePills">
          <button class="role-pill" data-role="patient" onclick="selectRole('patient')">
            <!-- Heart icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
            Patient journey
          </button>
          <button class="role-pill" data-role="doctor" onclick="selectRole('doctor')">
            <!-- Microscope icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 18h4M10 10l2-2m-4 0l2 2M9 4h2v6H9zM5 20h14M10 14a4 4 0 100-8 4 4 0 000 8z"/>
            </svg>
            Doctor portal
          </button>
          <button class="role-pill" onclick="selectRole('patient')">
            <!-- Chart bar icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18M7 16v-3M11 16v-6M15 16v-9M19 16v-1"/>
            </svg>
            Track signals
          </button>
          <button class="role-pill" onclick="selectRole('patient')">
            <!-- Sparkle icon -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
              <circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.5"/>
            </svg>
            Stay strong
          </button>
        </div>
      </div>

      <!-- Actions -->
      <div class="landing-actions anim-fade-up delay-3">
        <a href="/select/patient" id="ctaBtn" class="btn-primary">
          Start My Journey
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
        <a href="/select/doctor" class="btn-secondary-link">I'm a Doctor →</a>
      </div>

    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
